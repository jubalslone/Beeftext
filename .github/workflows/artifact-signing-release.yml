name: Lean Beeftext production signing (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-not-configured:
    name: Production signing is not configured
    runs-on: ubuntu-latest
    steps:
      - name: Stop without publishing an unsigned fallback
        shell: bash
        run: |
          echo "::error::Lean Beeftext production signing is intentionally disabled pending a separate reviewed release project."
          exit 1
