name: Azure signing smoke test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  signing-smoke-test:
    name: Verify direct signing and the Inno signing bridge
    runs-on: windows-2022
    timeout-minutes: 30
    environment: production-signing
    env:
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}

    steps:
      - name: Check out the selected smoke-test source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Verify source and signing configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -cne 'jubalslone/lean-beeftext') {
            throw "Unexpected repository identity: $env:GITHUB_REPOSITORY"
          }
          foreach ($name in @(
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_ACCOUNT',
            'ARTIFACT_SIGNING_PROFILE'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Protected signing configuration is missing: $name"
            }
          }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'The smoke-test checkout has tracked changes.' }

      - name: Parse all tracked PowerShell scripts before Azure authentication
        shell: pwsh
        run: ./Scripts/PowerShell/TestTrackedPowerShellSyntax.ps1

      - name: Azure login with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm Azure identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          az account show --query '{subscription:name, tenant:tenantId}' -o table
          if ($LASTEXITCODE -ne 0) {
            throw 'Azure OIDC login did not produce a usable Azure CLI session.'
          }

      - name: Build disposable direct-signing target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet new console --framework net8.0 --output signing-test --force
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not create disposable signing project.'
          }

          @'
          using System;

          internal static class Program
          {
          	private static void Main()
          	{
          		Console.WriteLine("Lean Beeftext Artifact Signing smoke test");
          	}
          }
          '@ | Set-Content -LiteralPath signing-test\Program.cs -Encoding utf8

          dotnet publish signing-test\signing-test.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:UseAppHost=true `
            --output signing-test\publish
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not build disposable signing target.'
          }

          $exe = Join-Path $PWD 'signing-test\publish\signing-test.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Disposable signing target was not produced: $exe"
          }

          $before = Get-AuthenticodeSignature -LiteralPath $exe
          Write-Host "Pre-sign status: $($before.Status)"

      - name: Sign disposable executable through the direct action
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\signing-test\publish\signing-test.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify direct-action signature and timestamp
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'signing-test\publish\signing-test.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          if ($signature.Status -ne 'Valid') {
            throw "Direct Artifact Signing smoke test status is $($signature.Status)."
          }
          if (-not $signature.SignerCertificate) {
            throw 'Direct Artifact Signing smoke test has no signer certificate.'
          }
          if (-not $signature.TimeStamperCertificate) {
            throw 'Direct Artifact Signing smoke test has no RFC 3161 timestamp certificate.'
          }
          Write-Host "Direct signer subject: $($signature.SignerCertificate.Subject)"
          Write-Host "Direct timestamp subject: $($signature.TimeStamperCertificate.Subject)"

      - name: Install pinned Inno Setup 7.1.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'Inno Setup 7'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          $expected = '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f'
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw "Inno Setup download hash mismatch: $actual" }
          $process = Start-Process -FilePath $download -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDirectory`""
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed with exit code $($process.ExitCode)." }
          $compiler = Join-Path $installDirectory 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Pinned Inno compiler was not installed.'
          }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile through the repository Inno signing bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payloadDirectory = Join-Path $env:RUNNER_TEMP 'lean-beeftext-signing-bridge-smoke'
          New-Item -ItemType Directory -Path $payloadDirectory -Force | Out-Null
          $payload = Join-Path $payloadDirectory 'payload.txt'
          'Disposable Lean Beeftext signing-bridge smoke payload.' |
            Set-Content -LiteralPath $payload -Encoding ascii

          $outputDirectory = Join-Path $PWD 'Installer\_output'
          if (Test-Path -LiteralPath $outputDirectory) {
            Remove-Item -LiteralPath $outputDirectory -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputDirectory | Out-Null

          $wrapper = (Resolve-Path ./Installer/Invoke-ArtifactSigning.ps1).Path
          $signToolCommand = "pwsh.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `$q$wrapper`$q -FilePath `$f"
          & $env:INNO_COMPILER `
            "--define=SmokePayload=$payload" `
            "--signtool=leanartifact=$signToolCommand" `
            ./Installer/SigningBridgeSmoke.iss 2>&1 |
            Tee-Object -FilePath signing-bridge-build-output.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $setup = Join-Path $outputDirectory 'Lean-Beeftext-Signing-Bridge-Smoke.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw 'Inno did not produce the disposable signed smoke installer.'
          }

      - name: Verify, install, and uninstall the signed bridge smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-VerifiedSignature([string]$Path, [string]$ExpectedSubject) {
            $signature = Get-AuthenticodeSignature -LiteralPath $Path
            if ($signature.Status -ne 'Valid') {
              throw "$Path Authenticode status is $($signature.Status)."
            }
            if (-not $signature.SignerCertificate) {
              throw "$Path has no signer certificate."
            }
            if (-not $signature.TimeStamperCertificate) {
              throw "$Path has no RFC 3161 timestamp certificate."
            }
            if ($ExpectedSubject -and $signature.SignerCertificate.Subject -cne $ExpectedSubject) {
              throw "$Path signer subject does not match the direct-action baseline."
            }
            return $signature
          }

          $direct = (Resolve-Path ./signing-test/publish/signing-test.exe).Path
          $setup = (Resolve-Path ./Installer/_output/Lean-Beeftext-Signing-Bridge-Smoke.exe).Path
          $directSignature = Get-VerifiedSignature $direct ''
          $setupSignature = Get-VerifiedSignature $setup $directSignature.SignerCertificate.Subject

          $installDirectory = Join-Path $env:ProgramFiles 'Lean Beeftext Signing Bridge Smoke'
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{D23051DC-AC48-4B3F-9409-7373B299397D}_is1'
          $install = Start-Process -FilePath $setup -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Disposable smoke installation failed with exit code $($install.ExitCode)."
          }

          $installedPayload = Join-Path $installDirectory 'payload.txt'
          $uninstaller = Join-Path $installDirectory 'unins000.exe'
          if (-not (Test-Path -LiteralPath $installedPayload -PathType Leaf)) {
            throw 'Disposable smoke payload was not installed.'
          }
          if (-not (Test-Path -LiteralPath $uninstallKey)) {
            throw 'Disposable smoke uninstall registration is missing.'
          }
          $uninstallerSignature = Get-VerifiedSignature $uninstaller $directSignature.SignerCertificate.Subject

          @(
            "Source commit: $((git rev-parse HEAD).Trim())"
            'Inno version: 7.1.0'
            'ArtifactSigning module: 0.1.8'
            "Direct signer subject: $($directSignature.SignerCertificate.Subject)"
            "Direct timestamp subject: $($directSignature.TimeStamperCertificate.Subject)"
            "Setup SHA-256: $((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant())"
            "Setup signature: $($setupSignature.Status)"
            "Setup signer subject: $($setupSignature.SignerCertificate.Subject)"
            "Setup timestamp subject: $($setupSignature.TimeStamperCertificate.Subject)"
            "Uninstaller SHA-256: $((Get-FileHash -LiteralPath $uninstaller -Algorithm SHA256).Hash.ToLowerInvariant())"
            "Uninstaller signature: $($uninstallerSignature.Status)"
            "Uninstaller signer subject: $($uninstallerSignature.SignerCertificate.Subject)"
            "Uninstaller timestamp subject: $($uninstallerSignature.TimeStamperCertificate.Subject)"
          ) | Set-Content -LiteralPath ./signing-test/SIGNING_BRIDGE_SMOKE_REPORT.txt -Encoding utf8

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Disposable smoke uninstall failed with exit code $($uninstall.ExitCode)."
          }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $installDirectory); ++$attempt) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path -LiteralPath $installDirectory) {
            throw 'Disposable smoke installation directory survived uninstall.'
          }
          if (Test-Path -LiteralPath $uninstallKey) {
            throw 'Disposable smoke uninstall registration survived uninstall.'
          }

          Get-Content -LiteralPath ./signing-test/SIGNING_BRIDGE_SMOKE_REPORT.txt

      - name: Clean disposable smoke installation
        if: always()
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:ProgramFiles 'Lean Beeftext Signing Bridge Smoke'
          $uninstaller = Join-Path $installDirectory 'unins000.exe'
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            $null = Start-Process -FilePath $uninstaller -ArgumentList @(
              '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
            ) -Wait -PassThru
          }
          for ($attempt = 0; $attempt -lt 20 -and (Test-Path -LiteralPath $installDirectory); ++$attempt) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path -LiteralPath $installDirectory) {
            Remove-Item -LiteralPath $installDirectory -Recurse -Force
          }
          $uninstallKey = 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{D23051DC-AC48-4B3F-9409-7373B299397D}_is1'
          if (Test-Path -LiteralPath $uninstallKey) {
            Remove-Item -LiteralPath $uninstallKey -Recurse -Force
          }

      - name: Azure logout
        if: always()
        shell: pwsh
        run: az logout

      - name: Upload disposable signing-smoke evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lean-Beeftext-Inno-signing-bridge-smoke
          path: |
            signing-test/SIGNING_BRIDGE_SMOKE_REPORT.txt
            signing-bridge-build-output.log
          if-no-files-found: warn
          retention-days: 7
